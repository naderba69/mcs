# MultiCS r82a — ملف التكوين النهائي المتكامل (2026-10-26)
# ============================================================================
# هذا الملف هو النسخة النهائية المدمجة التي تحتوي على:
# 1. جميع البروفايلات الأصلية (72 بروفايل)
# 2. التعديلات الأخيرة (DCWFILTER PATTERN: OFF لجميع البروفايلات)
# 3. التوثيق الكامل للتغييرات
# 4. إضافات R48 (2026-11-12): إعلانات cw1cycle (.80) في قوائم SID البيضاء
#    لتفعيل DCW CYCLE_CHECK فعليًا، وخيارات R48 الاختيارية (CYCLE ESTIMATE /
#    QUARANTINE / STORM GUARD / ROTATION FREEZE / CAP30) — كلها ON هنا.
#    انظر كتلة «حمايات R48» بعد CACHE PROTECTION.
#    ملاحظة cw1cycle: اللاحقة .80 تعني «النصف الأول (CW1) يأتي مع ecmtag
#    0x80» — وهي الاصطلاحية الافتراضية الشائعة. إن كان مزوّد يستخدم 0x81
#    فغيّر اللاحقة إلى .81 لذلك المزوّد؛ القيمة الخاطئة ترفض المفاتيح
#    (fail-closed) وتظهر في /user-trace كـ cycle mismatch. قوائم الرفض
#    (SID LIST !:) لم تُعلَن — القنوات المرفوضة لا تصل أصلًا. البروفايلات
#    بلا SID LIST يبقى فحص دورتها خاملًا (allow) حتى تُعرَف قنواتها.
