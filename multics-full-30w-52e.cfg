# HTTP LOGIN ALLOW: 127.0.0.1)
HTTP LOGIN DELAY: 250
# Band 57 web brute-force hard ban: 0 = OFF (stock, default). To arm:
# HTTP LOGIN FAILS: 5  +  HTTP LOGIN BAN: 3600  (ban seconds). Status shows
# on /user-trace (web guard line); FAILS: 0 disarms instantly.
# Band 116 merge: armed at 5. Field evidence is small but unambiguous: 26 web
# login attempts in the 03:35 snapshot, 25 of them FAILS with the admin
# username 'nader' -- one scripted guesser. A success clears the count, and
# the delay (250ms ramp) already throttles below this line; 5 keeps your own
# retries far clear of the bar. Set back to 0 to disarm instantly.
HTTP LOGIN FAILS: 5
HTTP LOGIN BAN: 3600
TELNET LOGIN DELAY: 250
# Band 60 per-protocol bans (loginthrottle protoban): 0 = OFF (stock).
# TELNET LOGIN FAILS: 5 + TELNET LOGIN BAN: 3600 arms the telnet door only;
# CCCAM LOGIN FAILS: 10 + CCCAM LOGIN BAN: 3600 arms CCcam only. Band 77:
# CCcam counts real credential failures only (unknown user / wrong password /
# wrong nodeid) -- connection churn, duplicate-session rejects and anything
# during a config reload (+10s grace) never counts, so saving this file from
# the web editor cannot ban your own IP (your browser + receiver share it).
# A success clears the count. Active bans show on /user-trace.
# TELNET/MGCAMD/NEWCAMD/CS378X/CAMD35/CACHEEX: left 0 = OFF on purpose --
# the traces show NO sustained credential failures on these doors (one
# mgcamd e1qs8h probe pair is a scan, not a run; newcamd lines are the
# operator's own paying clients). Arming them would invent a threat; the
# numbers to arm them with exist in the trace the day they appear.
TELNET LOGIN FAILS: 0
TELNET LOGIN BAN: 3600
# Band 116 merge: the only door with measured brute-force in the field traces
# -- 26+ credential failures from 3-4 IPs in the first minutes, sustained
# every ~10s at 03:35 (102.209.254.188 / 41.105.144.15 / 102.209.112.87 /
# 41.111.124.231 / 156.38.51.231). Band 77 semantics: counts REAL credential
# failures only; reload grace and duplicate-session rejects never count, so
# this cannot lock your own LAN (browser+receivers share your IP). Threshold
# 10 is above every legitimate user's fat-finger run; ban 1h.
CCCAM LOGIN FAILS: 10
CCCAM LOGIN BAN: 3600
# Band 61: same protoban for the newcamd and cs378x doors (0 = OFF).
# NEWCAMD counts credential failures; CS378X counts unknown-UCRC logins.
# (116) documented off: the 82/126/130 lines ARE the operator's own suppliers.
NEWCAMD LOGIN FAILS: 0
NEWCAMD LOGIN BAN: 3600
CS378X LOGIN FAILS: 0
CS378X LOGIN BAN: 3600
# Band 63: same protoban for the mgcamd door (0 = OFF).
# (116) said "single probe, no run"; the 51-minute field window falsified that:
# 102.152.212.113 / e1qs8h retried ~every 10-11s -- 12 failures inside 100s (16 rows: 12 x FAIL, 2 x ali OK, 1 x web OK) --
# while the legitimate 'ali' (185.252.234.119) succeeds and band 63 clears the
# count on success, so a real client can never be locked out by this line.
# Same threshold as cccam (10) because the measured run is the same shape.
MGCAMD LOGIN FAILS: 10
MGCAMD LOGIN BAN: 3600
# Band 76: same protoban for the camd35 door (0 = OFF). CAMD35 counts
# unknown-UCRC datagrams; a known client's frame clears the count.
CAMD35 LOGIN FAILS: 0
CAMD35 LOGIN BAN: 3600
# Band 78: same protoban for cacheex peer identities (0 = OFF). Counts
# only failures of a configured cacheex identity (CCcam cacheex_mode
# user with a wrong password); unknown identities stay with the door.
CACHEEX LOGIN FAILS: 0
CACHEEX LOGIN BAN: 3600
