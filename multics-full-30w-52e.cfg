#   هو نفسه حالة «صفر دوران» التي لديك). العلاج المتبقي للجوع ليس cfg على أي حال.
# * MARCHCHECK: ‏1722 علمًا/‏40 دقيقة (=‏43/د — نفس معدل الدقيقة الثالثة؛ لا انفجار)، ‏0 رفض،
#   وكلها «سُلّمت»؛ يبقى تسجيلًا حتى يظهر عمود CAID (بند ‏115 مُرشَّح) وأدنى تطابق مع عدم
#   تطابق DoubleCheck (‏110/‏14923 = ‏0.74% — لا ربط آلي بعد).
# * ‏1814:005211:13AE: محاولة ‏169 أفضت إلى ‏DCW timeout ‏3017ms ثم ‏8818ms مع أن الكاش كان
#   يحمل مُوثَّقات بوزن ‏2..5 (ستة نظّار) — هذه المادة نفسها التي كان ليخدمها «متأخر/دوران»
#   لو وُجد سابق محلي؛ لا تُعالَج بإرخاء البوابة بل بتغذيتها، والعدّاد الثالث (قابل للتصريح)
#   في ‏9602afb2 سيُظهر إن كان هناك ما يُغذّى. لا تغيير رقمي في هذا الملف لهذا السبب.
# ---- Band 115: الجوع البنيوي للبوابة — قراءة لقطة 03:35:05 (133510 طلبًا، 3.5 ساعة) ----
# * «قابل للتصريح» = 0 على 604333 رفضًا في 3.5 ساعة: حُسِم التنبؤ الأخير — لا المشغّل
#   يكتب SID LIST ولا البوابة تُشدَّد أو تُخفَّف؛ الجوع بنيوي (الحقل بلا منتج محلي).
#   عولج في الكود: ذاكرة آخر شفرة مُسلَّمة لكل قناة تُغذّي المُقدِّر نفسه ولا تفتح بابًا.
# * لا تغيير في CACHE CONSENSUS SOURCES: رفض الإجماع 6774 من 2364194 صوتًا (0.29%)
#   وإنقاذ 1814 ‏75.3% و1802 ‏71.0% — الاحتجاز زمنٌ لا حرمان، ثبت في نافذة ناضجة طويلة.
# * LATECW سجل علمه الأول (1814:13A9 عند 8445ms مقابل عتبة 8000، سُلّمت): التسليح مفيد؛
#   علم واحد من 20256 طلبًا ليس وباءً — يبقى تسجيلًا ولا يُرفع إلى رفض.
# * CW_DUP صفر رغم سيل stale/recycled على نفس المفاتيح: مفاتيح النظير تُرفض عند بوابة
#   الدورة قبل رافع CW_DUP فلا يبلغ عدّاد التكرار — دين مُسجَّل، لا يُعالَج بلمس CWDUP.
# * القناة الحيّة 1814:005211:13AE: كل محاولة تصل CW خلال ~1s من مصدر مجيب واحد،
#   والمصدر CCcam 326 يرجع stale أو NOK1 —Timeouts في المحاولات التي تُبطئ فيها المِجَبّات؛
#   لا يمسّ هذا البند أي زمن انتظار (CACHE TIMEOUT 299/400 كما هي).
# ------------------------------------------------------------------------------
# درع الكاش الموحّد (حقيقي — طبقة CA واحدة لكل الأنظمة):
CACHE PROTECTION: STANDARD
# Band 103 (field trace 2026-11-18): STANDARD arms SOURCES 3, but on
# the real peer population voter weights cap at ~2 (most peers sit at
# distrust weight 0), so held cache keys almost never reached the
# threshold and the cache contributed ~nothing on traced channels.
# Two distinct corroborating voters now deliver; the weighted REFUSE
# path for contradicted keys is unchanged.
CACHE CONSENSUS SOURCES: 2
# Band 105: the same line INSIDE a profile block is that profile's own
# override (2..8, e.g. a strict 3 for a multi-source bouquet while the
# starved ones inherit 2). The /user-trace overview lists every
# override next to the global default.
# Band 116 merge: CACHE CONSENSUS INDEPENDENCE — peer votes arriving from one
# IP count as ONE independent source (field traces show peer IDs 65xxx flooding
# single-IP relays; without this, held keys gain fake corroboration weights and
# the trustscore ladder (PEER REPUTATION above) is fed inflated votes).
# Refuses nothing; it only stops counting the same neighbor twice.
CACHE CONSENSUS INDEPENDENCE: ON
# CWPAIR (band 38): pair learning only -- serving needs a per-profile
# CWPAIR block pasted from /user-trace discovery, ACTIVE stays operator-set.
CWDEDUP CHECK: YES
CWPAIR DISCOVER CAID: 1814,1802,1843,1830,183D,183E
# ============================================================================
# حمايات R48 الاختيارية (مُفعّلة في هذا الملف؛ افتراضي الكود OFF):
# - CACHE CYCLE ESTIMATE: عند غياب علامة الدورة في رد نظير، تُقدَّر الدورة
#   من الدورة المتوقعة المعلنة (cw1cycle عبر SID LIST) أو زمنيًا من prevcw.
#   بدونها، أول CW غير مُعلَّم يُرفض ويجوع العميل (CACHE FILTER: YES أدناه).
# - CACHE QUARANTINE: تعارضان موزونان/10 دقائق على قناة -> HOLD 60s للكاش
#   فقط + حجر مزوّد (sid 0xFFFF). لا يحذف المصدر ولا يستبعده نهائيًا.
# - CACHE STORM GUARD: أكثر من 20 مفتاحًا/ثانية/قناة -> HOLD للزائد.
# - CACHE ROTATION FREEZE: hash/tag جديد يُصفّر التعارضات والحجر السابق.
# - CACHE CAP30: مصدر غير مُثبت (n<5) لا يتجاوز rank 30.
# كلها observe-safe: لا تغيير لبروتوكول الأقران ولا لسلوك الملفات المُسلَّمة.
# ============================================================================
# Band 115 (field trace 2026-11-19, uptime 03:35:05): the temporal estimator
# is ON but has NOTHING to measure -- all 604333 no-cycle refusals were
# classified "no prevcw" with the learnable column at 0, because
# pcache->prevcw has no local producer (only a peer's 16B ECM2cache tail
# writes it, clustredcache.c:4579+). Meanwhile MARCHCHECK flagged 10044
# half-parked DELIVERIES on these same channels: the rotation is real, the
# per-entry memory is what's missing. CACHE CYCLE MEMORY feeds the estimator
# from the last SERVED key per channel (1814:005211:13AE exists under two
# provids -- the key splits by provid on purpose). A candidate still needs
# exactly one carried-over half to pass: recycled keys (reason=stale/recycled
# below) and unrelated fresh keys keep their old refusal. Watch the tally
# line "دوران نصفي" -- it should move off zero; that is the proof it is
# judging, not being bypassed. TTL default 30s; raise only on measured
# provider cadence (CACHE CYCLE MEMORY: ON TTL: 45000).
# Band 119 correction, read this before judging the counters: until this band
# the memory's table and counters were `static` in a header included by several
# translation units, so /user-trace printed a private copy nothing wrote -- a
# permanent 0 that said NOTHING about whether the feature ran. Now the state is
# program-wide and a SECOND writer feeds it: every key committed to one of our
# own clients (setdcw.c), not only keys that survived the peer-relay gates. The
# line separates them ("Wrote=N (of which from local delivery M)"). On this
# binary `كُتب` must move off zero within a busy session; if it stays 0, suspect
# the wiring again, not the traffic. No gate decision changed: a candidate still
# needs exactly one carried-over half.
CACHE CYCLE MEMORY: ON
CACHE CYCLE ESTIMATE: ON
# Band 118: the single base build compiles the R22 CW-layers (they are a
# verification instrument, not a flavour) — but the line is written so the
# state is a decision, not an accident. NO here = the layers observe and
# count on /user-trace while the existing gates keep the only refusal
# authority; YES = the two reject points (obvious-fake pattern, propagation
# blocklist) arm too. Reload applies it without a rebuild.
R22 LAYERS: NO
# Band 116 merge: ERROR RESET narrows the DCW_ERROR mark to same-cycle keys
# (a stale CW from the other cycle no longer blackmarks a correct node).
# Observe-safe: it only refines WHO gets marked, never what is delivered.
CACHE CYCLE ERROR RESET: ON
CACHE QUARANTINE: ON
CACHE STORM GUARD: ON
CACHE ROTATION FREEZE: ON
CACHE CAP30: ON
CACHE EVIDENCE: ON
# ============================================================
# الأساس العام للبوابات الرافضة (بند 50): مطفأة عامًا عمدًا.
# القاعدة: العام أساس آمن للجميع، ولا تُفعَّل بوابة على CAID
# بعينه (بسطر داخل بروفايله) إلا إذا أثبت تريس CCcam مشكلة
# على قناته — رفض/شك/فايك في عدّادات /user-trace — فتُسلَّح
# له وحده وتُراقب عدّاداتها، وبسطر OFF داخل بروفايله تُطفأ
# عنه وحده دون مساس بالباقي. الأسطر التالية توثيق صريح
# للافتراضي، قيمها هي سلوك stock نفسه:
CACHE CI VALIDATE: OFF
CACHE DROPDIFFS: OFF
CACHE SERVICE DOUBT: OFF
# Band 116 merge: MONITOR ON (band 47: pure bookkeeping, no code acts on it).
# The operator's live complaint is exactly black-screen episodes (13AE); the
# page line was reading 'مطفأ' for no reason -- arming a monitor is not a policy.
AUTO RECOVER: ON
# Band 55 MARCHCHECK (same-slot parked half): 0=off (default), 1=log-only, 2=reject.
# Band 112 (field dump 2026-11-18, 22 min, 2306 req / 91033 gate candidates):
# every MARCHCHECK counter was zero and "مسلّح في: —" for both modes -- not
# because the pattern is absent, but because nothing was ever armed to look.
# Record mode is the only arming that CANNOT reject (the reject path lives at
# mode 2), so it is turned on here to end the chicken-and-egg; escalation
# stays per-profile exactly as before (DCW MARCHCHECK: 2 inside a profile,
# only once that profile's own flag count on /user-trace justifies it).
CACHE SF MARCHCHECK: 1
# Band 56 CW_DUP (same CW across new ECM cycles while a competitor CW exists):
# 0=off (default), 1=log-only, 2=reject; REP = new-cycle repeats before flag (2..10).
# A constant key with no competitor and a normal two-key roll never flag.
# Arm per CAID only on /user-trace evidence: DCW CWDUP: 1 inside that profile first.
CACHE SF CWDUP: 0
CACHE SF CWDUPREP: 4
# Band 58 CW_REUSE (half recycled on another channel inside the window):
# 0=off (default), 1=log-only, 2=reject. Full-CW twins (simulcrypt) never flag.
# Optional scope: CACHE SF REUSECAIDS: 1814,1802 (empty = all). Per-CAID: DCW CWREUSE: 1.
# Band 116 merge: armed LOG-ONLY globally. Why now: CW_DUP has stayed at 0
# while the field shows a flood of reason=stale/recycled refusals -- peer
# recycled keys die at the cycle gate (clustredcache.c:2793) BEFORE any
# refcount is touched, so the profile-armed detectors never see them. This
# is the measurement half of that debt: log-only flags, delivers everything,
# zero risk; if it stays 0 after a day, reuse-on-other-channel is real only
# inside the recycle-before-gate path and REUSECAIDS scoping gets its data.
CACHE SF CWREUSE: 1
CACHE SF CWREUSEWINDOW: 120000
# Band 59 LATECW (CW arriving after the ECM waited past LATECWMS):
# 0=off (default), 1=log-only, 2=reject. NEVER arm globally: slow-source
# profiles (card answers in tens of seconds) would be shot down. Per-CAID
# only, on /user-trace evidence: DCW LATECW: 1 inside that profile first.
# Band 65 per-CAID numeric thresholds inside a profile (0 = inherit global):
# DCW LATECWMS: 200000 (slow CAID), DCW CWREUSEWINDOW: 30000, DCW CWDUPREP: 2.
CACHE SF LATECW: 0
CACHE SF LATECWMS: 8000
