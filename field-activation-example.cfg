# ============================================================
# MCS field activation snippet (post-audit, bands 25-29)
# Merge into the GLOBAL section of your config (before profiles).
# Every line defaults to OFF in the binary; nothing here changes
# behaviour until you add it. Rollback = delete the lines and
# reload (in place, same inode) or restart.
# ============================================================

# Stage 1 (week 1, observe): cache consensus 600ms/3 sources,
# pattern gate, receiver attestation 2 -- one line arms all three.
CACHE PROTECTION: STANDARD

# Stage 1 (observe): Cache Intelligence quick validation as a
# rejecting gate on the live path (entropy / repeat / known-fake).
# Watch /user-trace for "Cache Intelligence validation" rejections
# before assuming they are all real fakes.
CACHE CI VALIDATE: ON

# Stage 2 (after a week of traces): per-profile strictness stays
# an operator choice -- e.g. DCWFILTER STRICT: ON per profile,
# ECM DOUBLECHECK stays observe-only until its decisions page
# shows a stable mismatch pattern for your CAIDs.

# R22 candidate layers need the r22 binary (bin/multics-r82a-r22-x64)
# and are on unless disabled:
# R22 LAYERS: YES
