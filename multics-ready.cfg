# كاش UDP صادر — أضف نظراءك بسطر لكل واحد (يُحذَّر الخيار المجهول):
CACHE PORT: 15560
# CACHE PEER: peer.example.com:12000 { csp=1 }

# العدّادات + الملخّص الدوري (شرح القراءة: docs/FIELD-GUIDE-ar.md)
DCW STATS: ON
STATS-WINDOW: 60000

# فرملة انتشار السمّ (2.8) — شغّلها بعد يوم من مراقبة سطر PEER TRUST:
PEER-TRUST-REQUESTS: OFF

# حمايات أُحدث — كلها مطفأة افتراضياً (OFF = سلوك stock حرفياً).
# اقرأ قسمها في docs/FIELD-GUIDE-ar.md قبل تفعيل أي واحد:
# CACHE CONSENSUS: ON           # تحكيم إجماع الشهود ضد الشفرات المفبركة (R8)
# CACHE CONSENSUS WINDOW: 400   # نافذة الشهادة بالمللي ثانية (100..2000)
# PEER REPUTATION: ON           # سلّم السمعة الدائم ضد النظير المسمّم (R4)
# CACHE QUEUE: ON               # طابور الكاش المحدود للفيض (R6)
# HTTP LOGIN DELAY: 250         # فرملة الدخول التصاعدية (R3)
# TELNET LOGIN DELAY: 250
# HTTP LOGIN ALLOW: 127.0.0.1   # قوائم السماح الدقيقة (R3)

