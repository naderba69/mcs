# ============================================================================
# MultiCS r82a — ملف التكوين النهائي المتكامل (2026-10-26)
# ============================================================================
# هذا الملف هو النسخة النهائية المدمجة التي تحتوي على:
# 1. جميع البروفايلات الأصلية (72 بروفايل)
# 2. التعديلات الأخيرة (DCWFILTER PATTERN: OFF لجميع البروفايلات)
# 3. التوثيق الكامل للتغييرات
# ============================================================================
# ============================================================================
# MultiCS r82a — ملف البروفايلات المعتمَد (R40: تحديث مهني لكل باقة)
# ============================================================================
# R40 — تدقيق مهني لكل باقة على سجل الأنظمة في الكود (src/casystem.h)
# ============================================================================
# كل بروفايل صُنّف من CAID نفسه لا من اسمه التجاري، وله الآن خصائص عائلته:
#   VideoGuard CSA (09xx عدا iCam): DCW HALFNULLED: YES + DCW SWAP: YES — لأن
#     نصف المفتاح الحقيقي قد يكون صفرًا (قاعدة stock نفسها)، وSWAP يجرّب ترتيب
#     النصفين. iCam ‏(0963/098D/098E) شفرتها AES كاملة بلا بايت مجموع: تبقى
#     HALFNULLED: NO (النصف غير مشروع لها) وCA MODERN يعطّل فحص البايت الرابع.
#   Nagravision (18xx) / Conax (0Bxx) / CryptoWorks (0Dxx) / Irdeto (06xx) /
#     Seca (01xx) / Viaccess (05xx) / BetaCrypt (17xx) / DRE-Crypt (4Axx):
#     CSA ببايت مجموع؛ نصف-المفتاح غير مشروع (HALFNULLED: NO) وSWAP لا يخصّها.
#   BISS1 ‏(2600) وTandberg ‏(1010): مفاتيح ثابتة محلية — ENABLE CACHE/
#     ENABLE CACHEEX: NO كي لا تُخزَّن ولا تُشارَك مع نظراء الكاش،
#     وDCWFILTER PATTERN: OFF لأن نصفي المفتاح الثابت متطابقان، وبوابة
#     الشكل (من CACHE PROTECTION: STANDARD) كانت ترفضه فلا يُسلَّم.
# أُزيلت أسطر كانت تُقرأ خطأً أو لا تُقرأ أصلًا (كانت تُوهم بحماية):
#   - CACHEEX PUSH / CACHEEX RELAY: لا فرع لهما في المفسّر (حذف).
#   - DCW VALIDECMTIME (عامًّا وداخل الباقات): لا فرع له؛ الصحيح
#     SERVER VALIDECMTIME (وهو موجود في كل باقة CA).
#   - FILTER / FILTER TIME داخل الباقات: مفتاح عام لا يقبل التخصيص لكل
#     باقة؛ نُقل مرة واحدة إلى القسم العام أدناه (نفس القيمة الفعلية).
#   - ACCEPT NULL ONID داخل الباقات: عام هو الآخر؛ نُقل إلى القسم العام.
#   - DEFAULT ECM CHECK / DEFAULT ECM CHECK LENGTH / DEFAULT FILTER /
#     DEFAULT FILTER TIME / DEFAULT DCW VALIDECMTIME: مستويات لا يعرفها
#     المفسّر (DEFAULT لا يملك هذه الفروع) فكانت بلا أثر.
#   - CACHEEX MAXHOP: 4 داخل الباقات: مشبك stock [1..2] كان يخفضها إلى 2؛
#     استُبدل بـ CACHEEX MAXHOP_LG: 4 (R39/D99) فتُحترم الأربع قفزات.
# لم تُخترع بيانات مشغّل: لا SID ولا HEADERWLST ولا مزوّدات جديدة.
# ============================================================================
# ============================================================================
# هذا الملف أساسه ملف المستخدم الأصلي (multics-r24-optimized) —
# بقوائم SID البيضاء ومهلاته وإعداداته الحقيقية لكل بروفايل — بعد:
#   1) تنفيذ المفاتيح التي كانت مكتوبة بلا أي أثر في الكود، فأصبحت
#      حقيقية الآن: ENABLE SKIPCWC + قوائم SID (D87)، DCW MINTIME
#      (D88)، DCW CYCLE_CHECK (D89)، ECM HEADERWLST + ENABLE SOFTCAM
#      (D90). اختبار حي: make -C tests sc (6/6).
#   2) أرضيات أمان موثّقة (لا تُخفَض):
#      - DEFAULT DCW MAXFAILED: 3 (كان 0، وصفر يعني «لا تحظر أي
#        مصدر فاشل أبدًا» — عكس المقصود).
#      - DCW MINTIME: 0 في كل بروفايل (R42/D105). كانت 100 في 70
#        بروفايل، فأي خط يجيب أسرع من 100ms كانت إجابته الصحيحة
#        تُرمى وتُسجَّل [MINTIME]، ثم ينتهي الطلب بـdcw timeout —
#        شاشة سوداء أو فريز مع أن المفتاح وصل. أثبت المخبر: سيرفر
#        يجيب في 30ms مع MINTIME 100 = 0/4، ومع 0 = 4/4. الميزة
#        باقية في الكود لمن يريدها، لكنها لا تُفعَّل في ملف نسلّمه.
#   3) إصلاح خطأ: بروفايل ORF - 0D98 كان بلا PORT فلا يستمع أبدًا؛
#      أُضيف PORT: 1981 (التالي الحر في نطاق الملف 1069-1980).
#   4) حُذفت أسطر ميتة مُتحقق أنها بلا مفسّر في الكود (كانت تعطي
#      إحساس حماية وهميًا): FAILBAN ENABLE (الحماية الحقيقية من
#      تخمين الدخول: HTTP/TELNET LOGIN DELAY)، DCW STRICT/LOG/
#      TRUSTSCORE، SERVER MINHPH، مفاتيح CACHE SF_*/SF_MC_*
#      (الدرع الحقيقي للكاش: CACHE PROTECTION أدناه)، ENABLE
#      ECMLOOPING، CCCAM OVERWRITE CAID.
# كل ميزة جديدة Opt-in افتراضيها OFF؛ هذا الملف يفعّل SKIPCWC
# عالميًا كما كتب المستخدم أصلًا (DEFAULT ENABLE SKIPCWC: YES).
#   5) دمج R37: ما طوّره المشروع ولم يكن في الملف أصبح مفعّلًا هنا:
#      CA MODERN في كل بروفايل (طبقة الأنظمة الحديثة الموحّدة —
#      لا أثر لها على الأنظمة الكلاسيكية)، PEER REPUTATION،
#      DCW STATS، LOGIN DELAY، وبوابتي CACHEEX ‏(BLOCK_FAKE_CW
#      وCWCHECK). التفاصيل والنواقص المتبقية: docs/REPORT-R37-ar.md.
# ============================================================================
# درع الكاش الموحّد (حقيقي — طبقة CA واحدة لكل الأنظمة):
CACHE PROTECTION: STANDARD
# ============================================================================
# تحديث 2026-10-26 — تعطيل DCWFILTER PATTERN لجميع البروفايلات
# ============================================================================
# تم تعطيل DCWFILTER PATTERN (DCWFILTER PATTERN: OFF) لجميع البروفايلات
# لأن دالة dcw_pattern_fake() في الكود كانت ترفض شيفرات صحيحة من الخوادم.
# هذا يسمح لجميع الشيفرات من الخوادم بالمرور دون فحص صارم للأنماط.
# البروفايلات المستثناة: BISS و Tandberg (كانت معطّلة مسبقاً)
# ============================================================================

CACHE ATTEST TTL: 600
# ============================================================================
# طبقة الحمايات المطوّرة المدمجة في هذا الملف (R37):
# ============================================================================
# عدّادات الأحكام وصفحة /cwlog (تعمل في نسخة stats المسلّمة؛ في نسخة
# stock تُقرأ وتُتجاهل بسطر تحذير واحد — نفس الملف يصلح للنسختين):
DCW STATS: ON
# ذاكرة المسمّمين الدائمة (R4): مراقبة ثم عدم استجواب ثم عزل ثم حظر،
# ولا عفو تلقائيًا. تُحفظ في multics.peers بجانب ملف الإعداد:
PEER REPUTATION: ON
PEER REPUTATION DISTRUST: 5
PEER REPUTATION ISOLATE: 20
PEER REPUTATION BAN: 50
# إتعب مخمّن كلمات المرور (R3): تأخير تصاعدي عند كل فشل؛ الدخول
# الصحيح يصفّر العدّ. (قائمة السماح اختيارية — مثال معطّل:
# HTTP LOGIN ALLOW: 127.0.0.1)
HTTP LOGIN DELAY: 250
TELNET LOGIN DELAY: 250
# ============================================================================
# القيم الافتراضية العامة (من ملف المستخدم، بالأرضيات أعلاه):
# ============================================================================

DEFAULT KEY: 01 02 03 04 05 06 07 08 09 10 11 12 13 14
# [محذوف عند التبنّي] DEFAULT FAILBAN ENABLE: لا يوجد هذا المفتاح في المفسّر.
#   الحماية الحقيقية من تخمين كلمات المرور: HTTP LOGIN DELAY / TELNET LOGIN DELAY.

# -- تفعيل فحص المفاتيح الإجباري --
DEFAULT DCW CHECK: YES
# [محذوف عند التبنّي] DEFAULT DCW MINTIME: قاعدة عامة ترفض قارئات محلية
#   سريعة شرعية. R42/D105: القيمة لكل بروفايل هي 0 (مطفأة)؛ فعّلها
#   بنفسك فقط إن كان كل خطوطك تجيب أبطأ من الحد الذي تختاره.
DEFAULT DCW MAXFAILED: 3
DEFAULT DCW RETRY: 2
DEFAULT DCW CYCLE_CHECK: YES

# -- اختبار صلاحية المفتاح (يمنع إرسال CW لا يعمل) --
DEFAULT ENABLE SKIPCWC: YES

# -- كاش ديناميكي نظيف --
DEFAULT CACHE STATIC: NO
DEFAULT CACHE TIMEOUT: 350
DEFAULT CACHE SENDREQ: YES
DEFAULT CACHE RESENDREQ: YES
DEFAULT CACHE SENDREP: YES

# -- خادم حي سريع وموثوق --
DEFAULT SERVER FIRST: 3
DEFAULT SERVER TIMEOUT: 1000
DEFAULT SERVER INTERVAL: 100
DEFAULT SERVER VALIDECMTIME: 1000
DEFAULT SERVER MAX: 0
DEFAULT SERVER ECMTIME: 0
# [محذوف عند التبنّي] DEFAULT SERVER MAXPING: لا مفتاح بهذا الاسم في أي مستوى.
# [محذوف عند التبنّي] DEFAULT SERVER MINHPH: مفتاح بلا تنفيذ في الكود.
DEFAULT SERVER THRESHOLD: 0
# [محذوف عند التبنّي] DEFAULT SERVER CACHE_THRESHOLD: لا مفتاح بهذا الاسم في أي مستوى.

# -- خيارات الشبكات والبروتوكولات --
# نصف-المفتاح: عائلة VideoGuard (09xx) وحدها — وليس Conax (0Bxx).
CAID FAMILY HALFNULLED: 09

# سياسة العائلات صريحة (قيمها = افتراضي stock حرفيًا؛ كتابتها توثيق لا تغيير):
# بطاقة تُطابَق بصرامة المزوّد في Seca/Viaccess فقط.
CAID FAMILY PROVIDERCHECK: 01, 05
# توجيه البروفايل دون فحص المزوّد: Nagravision/VideoGuard/Conax.
CAID FAMILY NOPROVCHK: 18, 09, 0B
# فلتر الكاش عام بطبيعته (لا يوجد مفتاح لكل باقة في المفسّر):
# NO = الشكل الصارم: لا تُخدَم إلا المفاتيح الحاملة لعلامة دورة.
FILTER: NO
# نافذة الطزاجة = 10 ثوانٍ (الوحدة ×1000، السقف 10). هذا ما كان يسري فعليًا
# من آخر سطر داخل الباقات (50 × 1000 ثم القصّ إلى 10).
FILTER TIME: 10
# ONID الفارغ مقبول (كان مكرّرًا داخل 3 باقات، وهو عام في الكود):
ACCEPT NULL ONID: YES

DEFAULT RETRY NEWCAMD: 3
DEFAULT RETRY CCCAM: 3
# [محذوف عند التبنّي] DEFAULT RETRY MGCAMD: لا حقل إعادة محاولة لـ mgcamd في الكود.
DEFAULT CACHEEX VALIDECMTIME: 7000
DEFAULT CACHEEX MAXHOP: 3
DEFAULT CACHEEX MAXHOP_LG: 4
DEFAULT CACHEEX LOCAL_ONLY: NO
# (R37: فعّلنا BLOCK_FAKE_CW وCWCHECK: 2 من وصفة R1 المُثبتة. أبقينا
# LOCAL_ONLY مطفأة: تفعيلها يمنع بذور التسخين الاستباقية — رافعة
# بيدك إن أردت أقصى تشدد ضد التسميم الاستباقي.)
DEFAULT CACHEEX CWCHECK: 2
DEFAULT CACHEEX BLOCK_FAKE_CW: YES

# -- قبول البيانات --
DEFAULT ACCEPT NULL SID: NO
DEFAULT ACCEPT NULL CAID: YES
DEFAULT ACCEPT NULL PROVIDER: YES

# -- تفعيل البروتوكولات --
DEFAULT ENABLE CCCAM: YES
DEFAULT ENABLE NEWCAMD: YES
DEFAULT ENABLE RADEGAST: YES
DEFAULT ENABLE CACHE: YES
DEFAULT ENABLE CAMD35: YES
DEFAULT ENABLE CS378X: YES
DEFAULT ENABLE MGCAMD: YES
DEFAULT ENABLE FREECCCAM: YES
DEFAULT ENABLE CACHEEX: NO

# -- إعدادات ECM --

# -- تعطيل الحماية القديمة (تم استبدالها بـ R22/R24) --

# ============================================================================
# (R37) حُذفت من هنا كتل تعليقات قديمة كانت تصف «55 طبقة» وأنظمة
