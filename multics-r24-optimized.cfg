# ============================================================================
# MultiCS r82a — بروفايلات محدّثة احترافيًا (R32 / D83)
# ============================================================================
# التحديث: 2026-10-16 — أعيدت كتابة هذا الملف كاملًا ضد البناء الحالي.
#
# ما تغيّر عن نسخة R24 ولماذا:
#   * حُذفت كل الأسطر الوهمية: النسخة القديمة كانت تذكر أنظمة غير
#     موجودة في البناء أصلًا (SF_*, DCW STRICT, SUPERSMARTFILTER,
#     DCW MINTIME, CACHEEX PUSH/RELAY...) — أسطر يتجاهلها المفسّر
#     بصمت فتعطي إحساسًا كاذبًا بالحماية. كل سطر باقٍ هنا يقرأه
#     المفسّر فعلًا (مُتحقق منه في src/config.c وفي اختبار إقلاع حي).
#   * وُحّدت كتلة الاستقرار على الـ71 بروفايلًا بقيم مُثبتة في
#     اختبارات حية (tests/at، tests/fz، tests/cachepref).
#   * أُصلح بروفايل [ORF - 0D98] الذي كان بلا PORT أصلًا.
#
# كيف تستعمل هذا الملف:
#   هذا قالب بروفايلات + درع عام. أضف في ملف إعداداتك الرئيسي (أو هنا
#   في الأعلى): HTTP PORT و TELNET PORT وأسطر CACHE PEER وأسطر USER
#   داخل كل بروفايل تستعمله. مفاتيح BISS/Tandberg تُدخَل من صفحة
#   الويب /biss لا من هنا. الافتراضي في الخادم كله (بلا هذا الملف)
#   يبقى stock؛ هذا الملف هو وصفة التفعيل الاحترافية.
# ============================================================================

# ============================================================================
# الدرع العام — Global Shield (كل سطر هنا حقيقي ويقرأه المفسّر)
# ============================================================================
# سطر واحد يشغّل: إجماع الكاش (نافذة 600ms، 3 مصادر مستقلة) + بوابة
# شكل الفايك + شهادة المستقبِلين (عميلان). أي سطر لاحق يعدّل قطعته.
CACHE PROTECTION: STANDARD
# مدة حفظ الشهادة بالثواني (60..3600؛ غيابها = 300): 600 توازن بين
# إمساك الفايك الموسمي وعدم إطالة أثر شهادة قديمة.
CACHE ATTEST TTL: 600

# قيم افتراضية تسري على كل بروفايل ما لم يعدّلها بنفسه (DEFAULT):
DEFAULT DCW CHECK: YES
DEFAULT DCW MAXFAILED: 3
DEFAULT DCW RETRY: 2
DEFAULT DCW TIMEOUT: 6000
DEFAULT CACHE TIMEOUT: 2000
DEFAULT SERVER TIMEOUT: 1000
DEFAULT SERVER VALIDECMTIME: 1000

# بوابات التبادل (CacheEx) — حقيقية لكنها تخصّ طوبولوجيتك أنت:
# فعّلها فقط إن كنت تستقبل دفعات CacheEx من شركاء:
# DEFAULT CACHEEX LOCAL_ONLY: YES
# DEFAULT CACHEEX BLOCK_FAKE_CW: YES
# DEFAULT CACHEEX CWCHECK: 2

# ============================================================================
# البروفايلات — كتلة الاستقرار الموحّدة (قيم مُثبتة حيًّا):
#   DCW CHECK YES + HALFNULLED NO : يرفض الشفرات المشوّهة/النصفية
#   DCW MAXFAILED 3 / RETRY 2     : فشل متكرر يحرّك التدوير لا السواد
#   CACHE TIMEOUT 2000            : نافذة كاش كريمة بلا تجمّد وسطي
#   DCW TIMEOUT 6000              : مهلة شفرة كاملة قبل إعلان الفشل
#   SERVER TIMEOUT/VALIDECMTIME 1000 : توازن سرعة/صبر مجرّب
# ============================================================================

