# Live smoke-test config for MultiCS r82a — filter-gate verification.
# Used by: make -C tests dcwfilter
#
# A profile section is MANDATORY: without one cfg.cardserver stays NULL and
# main.c refuses to start. Ports are distinct from multics-live.cfg so the two
# targets can run in the same session.

HTTP PORT: 15600
HTTP USER: admin
HTTP PASS: admin
TELNET PORT: 15100

# TASK 1.10b — turn both acceptDCW() filters off. The parser must acknowledge
# each one in the debug log; that line is what `make dcwfilter` greps for.
DCWFILTER REPEAT: OFF
DCWFILTER CHECKSUM: OFF

# A deliberately bogus sub-option: it must be reported by name, not silently
# ignored and not logged as an empty string.
DCWFILTER BOGUS: ON

# TASK 1.2 — retry classification windows. Both must be echoed by the parser
# with the value actually applied, which is how the clamping gets proved too.
RETRY-WINDOW: 4000
SOFT-FAIL-WINDOW: 5000
# A value below the floor must be clamped to 500, not stored as written.
RETRY-WINDOW: 10

[ filtertest ]
CAID: 1884
PORT: 15601
USER: u1 p1
