# نموذج إعداد إنتاج — MultiCS r82a المُحصَّن (التجميد D53، 2026-09-28)
#
# كل سطر في هذا الملف مُتحقَّق من محلّل الشجرة نفسه وأُجُرِّب حيّاً على
# الثنائية المجمَّدة. عدّل القيم الظاهرة ببيانك، لا تُضِف سطراً من خارج
# ملفات المشروع: أي خيار غير معروف يُحذَّر باسمه عند الإقلاع، وأي قيمة
# مقتبسة أطول من حقلها تُقصّ بحدّ المخزن (3.8b) بلا رسالة.
#
# القاعدة الذهبية: بايناري العدّادات (multics-r82a-stats-x64) هو الذي
# يفهم سطر DCW STATS ويحمل العدّادات. المخزون يتجاهله ويكمل.

# ----------------------------- الواجهات -----------------------------

HTTP PORT: 15500
HTTP USER: admin
HTTP PASS: change-me-now
HTTP TITLE: "MultiCS r82a hardened"

TELNET PORT: 15502
# تحذير ميداني: telnet له اسم وكلمة سر خاصان به، وبلا سطرَي TELNET
# USER/PASS لا يدخل أحد أبداً (الاسم الفارغ يُخفق دائماً). حقوله رموز
# خاماً كحقول USER/PASS: بلا اقتباس.
TELNET USER: admin
TELNET PASS: change-me-too

# ----------------------------- الكاش --------------------------------

# منفذ كاش UDP صادر. كل CACHE PEER يُعرَّف بسطر مستقل:
#   CACHE PEER: host:port { csp=1 }
# المُفتاح csp=1 لنظير Multics/CSP عادي. حارس البروتوكول (2.9) يُسقط
# الحزم القصيرة بلا تحليل، وحارس GR10 يمنع إعادة دفع مفتاح وصل من نظير.
CACHE PORT: 15560
# CACHE PEER: peer.example.com:12000 { csp=1 }

# فرملة الانتشار (2.8): نظير يهبط تحت خط الثقة على CAID ما يُستثنى من
# جولة الطلبات مدى نافذة، ويُسأل من جديد للاختبار. OFF افتراضياً؛ شغّله
# بعد يوم من مراقبة سطر PEER TRUST في السجل.
PEER-TRUST-REQUESTS: OFF

# ----------------------------- العدّادات ----------------------------

# ON يُسلّح عدّادات رفض acceptDCW. تُقرأ من telnet بأمر dcwstats ومن
# الصفحة الرئيسية، وتُصفّر بـ dcwstats reset. على المخزون يُحذَّر أن
# البناء بلا عدّادات ويكمل.
DCW STATS: ON

# سطر ملخّص دوري بالسجل كل نافذة، صفر يوقفه. 60 ثانية بداية معقولة:
# راقب اتجاه الأرقام لا الرقم الواحد.
STATS-WINDOW: 60000

# ------------------------- الحدود الزمنية ---------------------------

# أرضية زمن أدنى لردود Newcamd (GR5: الكاش معفى منها). الصفر = مفعّلة
# لا شيئاً. فعّلها فقط بعد أن يريك STATS-WINDOW نمطاً حقيقياً؛ القيمة
# المبالغ فيها تُخر بطاقات بطيئة صالحة.
# MIN-CARD-LATENCY: 150

# مفتاح مُدان بالدليل (2.6 / BAD-DCW): لا يُسلَّم ولا يُخزَّن أبداً،
# يُعدّ في عدّاد bad-dcw-list. الثمانية والعشرون رقماً ست عشرة بايتاً.
# BAD-DCW: 000102030405060708090a0b0c0d0e0f

